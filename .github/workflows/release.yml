name: Release

# Push a tag such as v0.1.0 to build every platform and publish a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64,  os: windows-latest,   target: x86_64-pc-windows-msvc,   ext: .exe, archive: zip,    upx: true }
          - { name: linux-x64,    os: ubuntu-latest,    target: x86_64-unknown-linux-gnu, ext: "",   archive: tar.gz, upx: true }
          - { name: macos-arm64,  os: macos-latest,     target: aarch64-apple-darwin,     ext: "",   archive: tar.gz, upx: false }
          - { name: macos-x64,    os: macos-15-intel,   target: x86_64-apple-darwin,      ext: "",   archive: tar.gz, upx: false }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libgl1-mesa-dev
      - name: Test
        run: cargo test --workspace --release --target ${{ matrix.target }}
      - name: Build
        run: cargo build --workspace --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME:-dev}"
          dir="truelossless-${version}-${{ matrix.name }}"
          mkdir "$dir"
          for bin in truelossless truelossless-gui; do
            cp "target/${{ matrix.target }}/release/${bin}${{ matrix.ext }}" "$dir/"
          done
          cp README.md "$dir/"
          cp assets/icon.png "$dir/"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "$dir.zip" "$dir" > /dev/null
            echo "ASSET=$dir.zip" >> "$GITHUB_ENV"
          else
            tar czf "$dir.tar.gz" "$dir"
            echo "ASSET=$dir.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}

      # Portable build: the same programs compressed with UPX (smaller download,
      # slightly slower start-up). Skipped on macOS, where UPX breaks code signing.
      - name: Install UPX
        if: matrix.upx
        uses: crazy-max/ghaction-upx@v3
        with:
          install-only: true
      - name: Package portable (UPX)
        if: matrix.upx
        shell: bash
        run: |
          version="${GITHUB_REF_NAME:-dev}"
          dir="truelossless-${version}-${{ matrix.name }}-portable"
          mkdir "$dir"
          for bin in truelossless truelossless-gui; do
            cp "target/${{ matrix.target }}/release/${bin}${{ matrix.ext }}" "$dir/"
            upx --best --lzma "$dir/${bin}${{ matrix.ext }}"
          done
          cp README.md assets/icon.png "$dir/"
          # Check that the compressed programs still start.
          "$dir/truelossless${{ matrix.ext }}" --version
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "$dir.zip" "$dir" > /dev/null
            echo "PORTABLE=$dir.zip" >> "$GITHUB_ENV"
          else
            tar czf "$dir.tar.gz" "$dir"
            echo "PORTABLE=$dir.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        if: matrix.upx
        with:
          name: ${{ matrix.name }}-portable
          path: ${{ env.PORTABLE }}

  publish:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
