[package]
name = "flac-checker-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Audio file probing and authenticity analysis"

[dependencies]
symphonia = { version = "0.5", default-features = false, features = ["flac", "alac", "isomp4", "wav", "aiff", "mp3", "aac", "ogg", "vorbis", "pcm"] }
walkdir = "2"
rayon = "1"
realfft = "3"
md-5 = "0.10"
thiserror = "2"

[features]
# Exposes the synthetic-audio helpers used by tests, for the sample generator.
testgen = []

[[example]]
name = "gen_samples"
required-features = ["testgen"]
